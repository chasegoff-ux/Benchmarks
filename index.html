    const fmtNum = (n) => n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("en-US");

    const fmtCpm = (n) => n == null || isNaN(n) ? "—" : "$" + n.toFixed(2);

    // Normalize slug → array of prefix slugs (so a pub can absorb data from
    // multiple Periscope ad_unit prefixes, e.g. "so-cal" + "socal").
    const slugList = (slug) => Array.isArray(slug) ? slug : [slug];
    const matchesAnySlug = (adUnit, slugs, suffix) => {
      if (!adUnit) return false;
      if (suffix == null) return slugs.some(s => adUnit.startsWith(s + "_"));
      return slugs.some(s => adUnit === s + "_" + suffix);
    };

    // Aggregate raw rows into Takeover + Sponsored Link metrics for a single pub slug.
    function aggregate(rows, slug) {
      const slugs = slugList(slug);
      const matching = rows.filter(r => matchesAnySlug(r.ad_unit, slugs));
      if (!matching.length) return { takeover: null, sponsoredLink: null };

      // First row to match the given suffix across any of the slugs.
      const get = (suffix) => matching.find(r => matchesAnySlug(r.ad_unit, slugs, suffix));
      // Newsletters use "presented" (no -by) and "mid-ad" instead of text-1. Support both.
      const footer = get("footer");
      const lead   = get("lead");
      const presBy = get("presented-by") || get("presented");
      const t1     = get("text-1") || get("mid-ad");
      const t2     = get("text-2");
      const t3     = get("text-3");

      // Takeover bundle = Footer + Lead + Presented-By + text-1 (the in-text)
      // Impressions/Clicks/Leads = SUM. CTR = AVERAGE of the component CTRs.
      const tParts = [footer, lead, presBy, t1].filter(Boolean);
      const takeover = tParts.length ? {
        impressions: tParts.reduce((s, p) => s + (p.impressions || 0), 0),
        clicks:      tParts.reduce((s, p) => s + (p.clicks || 0), 0),
        leads:       tParts.reduce((s, p) => s + (p.leads || 0), 0),
        ctr:         tParts.reduce((s, p) => s + (p.ctr || 0), 0) / tParts.length,
        components:  tParts.length
      } : null;

      // Sponsored Link = AVERAGE of text-1, text-2, text-3 (rep gets one slot, could be any)
      const slParts = [t1, t2, t3].filter(Boolean);
      const sponsoredLink = slParts.length ? {
        impressions: slParts.reduce((s, p) => s + (p.impressions || 0), 0) / slParts.length,
        clicks:      slParts.reduce((s, p) => s + (p.clicks || 0), 0) / slParts.length,
        leads:       slParts.reduce((s, p) => s + (p.leads || 0), 0) / slParts.length,
        ctr:         slParts.reduce((s, p) => s + (p.ctr || 0), 0) / slParts.length,
        components:  slParts.length
      } : null;

      return { takeover, sponsoredLink };
    }

    // For Dedicated Emails / full-buy Narrative products, sum all matching ad units.
    // Assumes rows have already been filtered by pub_type and market upstream.
    function dedicatedMetrics(rows, slug) {
      const slugs = slugList(slug);
      const matching = rows.filter(r => matchesAnySlug(r.ad_unit, slugs));
      if (!matching.length) return null;
      return {
        impressions: matching.reduce((s, p) => s + (p.impressions || 0), 0),
        clicks:      matching.reduce((s, p) => s + (p.clicks || 0), 0),
        leads:       matching.reduce((s, p) => s + (p.leads || 0), 0),
        ctr:         matching.reduce((s, p) => s + (p.ctr || 0), 0) / matching.length,
        components:  matching.length
      };
    }

          return;
        }
        setLoadStatus("loading");
        setLoadError("");
        const cbName = "cb_" + Date.now();
        window[cbName] = (data) => {
          delete window[cbName];
          if (!data || !data.success) {
            setLoadStatus("error");
            setLoadError((data && data.error) || "Unknown error");
            return;
          }
          setRows(data.rows || []);
          setLastUpdated(data.lastUpdated || new Date().toISOString());
          setLoadStatus("ok");
        };
        const s = document.createElement("script");
        s.src = SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + "callback=" + cbName;
        s.onerror = () => {
          delete window[cbName];
          setLoadStatus("error");
          setLoadError("Failed to load from Apps Script. Check the SCRIPT_URL value and that the Web App is deployed with 'Anyone' access.");
        };
        document.head.appendChild(s);
      };

      useEffect(() => { fetchData(); }, []);

      // Pre-compute aggregated benchmarks for each pub in the rate card.
      // Filter by pub_type AND market (if set) so pubs that share a slug across
      // markets (e.g. "rundown" in chicago vs new-york) don't cross-contaminate.

          if (p.isRoS) {
            out[p.id] = { ros: ROS_UNIT_METRICS };
            return;
          }

            // Custom Content is a standalone product with no benchmark data.

            return;
          }
          const filtered = rows.filter(r =>
            (!p.pubType || r.pub_type === p.pubType) &&
            (!p.market || r.market === p.market)
          );
          if (p.fullBuy || p.sponsoredLink == null) {
            // Narrative / full-email buys: Takeover-only. The in-text ads in
            // these pubs are NOT sponsored links — text ads and in-text ads
            // are different products. Do not emit a Sponsored Link benchmark.
            // Multiplier scales impressions/clicks/leads for multi-send
            // products like weeklong buyouts (CTR stays the same).
            const base = dedicatedMetrics(filtered, p.slug);
            const mult = p.multiplier || 1;
            const scaled = base ? {
              ...base,
              impressions: base.impressions * mult,
              clicks:      base.clicks * mult,
              leads:       base.leads * mult
            } : null;
            out[p.id] = { takeover: scaled, sponsoredLink: null };
          } else {
            out[p.id] = aggregate(filtered, p.slug);
          }
        });
        return out;
      }, [rows, liveRateCard]);

      // Build a quick diagnostic view to show the user exactly what came back
      // from Apps Script. Surfaces row count + distinct pub_types/markets so
      // a "green light, empty stats" situation is immediately explainable.
      const rowsDebug = useMemo(() => {
        if (loadStatus !== "ok") return null;
        const pubTypes = Array.from(new Set(rows.map(r => r.pub_type).filter(Boolean))).sort();
        const markets  = Array.from(new Set(rows.map(r => r.market).filter(Boolean))).sort();
        return { count: rows.length, pubTypes, markets };
      }, [rows, loadStatus]);

      return (
        <div className="min-h-screen">
          <Header
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            loadStatus={loadStatus}
            lastUpdated={lastUpdated}
            rowCount={loadStatus === "ok" ? rows.length : null}
            onRefresh={fetchData}
          />

          {loadStatus === "error" && (
            <div className="max-w-7xl mx-auto px-6 mt-4">
              <div className="bg-red-50 border border-red-200 text-red-800 rounded-lg p-4 text-sm">
                <div className="font-semibold mb-1">Couldn't load benchmarks</div>
                <div>{loadError}</div>
              </div>
            </div>
          )}

          {rowsDebug && rowsDebug.count === 0 && (
            <div className="max-w-7xl mx-auto px-6 mt-4">
              <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-4 text-sm">
                <div className="font-semibold mb-1">Apps Script returned 0 rows</div>
                <div>The Web App is reachable, but the Benchmarks sheet looks empty. Paste the Periscope CSV into cell A1 of the <code className="bg-amber-100 px-1 rounded">Benchmarks</code> tab, then hit Refresh.</div>
              </div>
            </div>
          )}

          {rowsDebug && rowsDebug.count > 0 && rowsDebug.pubTypes.length === 0 && (
            <div className="max-w-7xl mx-auto px-6 mt-4">
              <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-4 text-sm">
                <div className="font-semibold mb-1">{rowsDebug.count} rows loaded, but all publication_type values are blank</div>
                <div>The header row likely got mangled. Confirm row 1 of the Benchmarks sheet reads exactly: <code className="bg-amber-100 px-1 rounded">publication_type, market, ad_unit, impression_avg, click_avg, ctr, lead_avg</code></div>
              </div>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-6 py-6">
            {activeTab === "benchmarks" && (
              <BenchmarksTab rateCard={liveRateCard} aggregated={aggregated} loadStatus={loadStatus} rows={rows} />
            )}
            {activeTab === "calculator" && (
              <CalculatorTab
                rateCard={liveRateCard}
                aggregated={aggregated}
                lineItems={lineItems}
                setLineItems={setLineItems}
              />
            )}
            {activeTab === "ratecard" && (
              <RateCardTab rateCard={liveRateCard} />
            )}
          </main>

          <footer className="text-center text-xs text-slate-400 py-6">
            Bisnow Benchmarks & Proposal Calculator · Data refreshes when the connected Google Sheet updates
          </footer>
        </div>
      );
    }

    function Header({ activeTab, setActiveTab, loadStatus, lastUpdated, rowCount, onRefresh }) {
      const tabs = [
        { id: "benchmarks", label: "Benchmarks" },
        { id: "calculator", label: "Proposal Calculator" },
        { id: "ratecard",   label: "Rate Card" },
      ];
      const dot = loadStatus === "ok" ? "bg-green-400" : loadStatus === "loading" ? "bg-amber-400 animate-pulse" : loadStatus === "error" ? "bg-red-400" : "bg-slate-400";
      const updatedTxt = lastUpdated
        ? "Updated " + new Date(lastUpdated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
        : "—";
      return (
        <header className="navy text-white">
          <div className="max-w-7xl mx-auto px-6 pt-6 pb-0">
            <div className="flex justify-between items-start">
              <div>
                <div className="text-xs uppercase tracking-widest text-white/80 mb-1">Bisnow · Sales Tools</div>
                <h1 className="text-3xl font-bold">Ad Benchmarks & Proposal Calculator</h1>
              </div>
              <div className="flex items-center gap-3 text-sm">
                <div className="flex items-center gap-2">
                  <div className={"w-2 h-2 rounded-full " + dot}></div>
                  <span className="text-white/90">{updatedTxt}</span>
                  {rowCount != null && <span className="text-white/60 text-xs">· {rowCount} rows</span>}
                </div>
                <button onClick={onRefresh} className="px-3 py-1.5 rounded-md bg-white/15 hover:bg-white/25 transition text-sm">↻ Refresh</button>
              </div>
            </div>
            <nav className="mt-6 flex gap-1">
              {tabs.map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={"px-4 py-2.5 text-sm font-medium border-b-2 transition " + (activeTab === t.id ? "border-white text-white" : "border-transparent text-white/70 hover:text-white")}
                >
                  {t.label}
                </button>
              ))}
            </nav>
          </div>
        </header>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // BENCHMARKS TAB
    // ─────────────────────────────────────────────────────────────
    const PRODUCT_BADGE_CLASS = {
      "Takeover":        "bg-orange-100 text-orange-700",
      "Sponsored Link":  "bg-purple-100 text-purple-700",
      "Custom Content":  "bg-amber-100 text-amber-700",
      "Run of Site":     "bg-sky-100 text-sky-700",
    };

    function BenchmarksTab({ rateCard, aggregated, loadStatus, rows }) {
      const [filter, setFilter] = useState("All");
      const [search, setSearch] = useState("");
      const [sortKey, setSortKey] = useState(null);           // null | "publication" | "product" | "impressions" | "clicks" | "ctr" | "leads" | "price" | "cpm"
      const [sortDir, setSortDir] = useState("asc");          // "asc" | "desc"
      const [showDebug, setShowDebug] = useState(false);

      // Quick diagnostic summary of what Apps Script sent us — makes it easy
      // to spot slug / market / pub_type mismatches that would cause the table
      // to show "—" everywhere despite a green status light.
      const debug = useMemo(() => {
        if (!rows || !rows.length) return null;
        const pubTypes = Array.from(new Set(rows.map(r => r.pub_type).filter(Boolean))).sort();
        const markets  = Array.from(new Set(rows.map(r => r.market).filter(Boolean))).sort();
        const adUnitPrefixes = Array.from(new Set(rows.map(r => {
          const a = r.ad_unit || "";
          const i = a.indexOf("_");
          return i > 0 ? a.slice(0, i) : a;
        }).filter(Boolean))).sort();
        return { count: rows.length, pubTypes, markets, adUnitPrefixes, sample: rows.slice(0, 3) };
      }, [rows]);

      // Benchmarks tab only shows Periscope-sourced products — Custom Content and Run of Site
      // are calculator-only products with no benchmark data, so they're filtered out here.
      const BENCH_CATEGORIES = CATEGORIES.filter(c => c !== "Run of Site" && c !== "Custom Content");

      // Display-only label overrides for the benchmarks page. Underlying
      // data (p.category) stays as "Asset Class" so other tabs are unaffected.
      const BENCH_CATEGORY_LABEL = { "Asset Class": "National MB" };
      const catLabel = (c) => BENCH_CATEGORY_LABEL[c] || c;

      const filtered = useMemo(() => {
        return rateCard.filter(p => {
          if (p.isRoS || p.isCustomContent) return false;
          if (filter !== "All" && p.category !== filter) return false;
          if (search && !p.displayName.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });
      }, [rateCard, filter, search]);

      // Build flat row list — each pub that sells a Sponsored Link produces
      // 2 rows (Takeover + Sponsored Link). Narrative / full-buy pubs are
      // Takeover-only (their in-text ads are not Sponsored Links). The
      // Sponsored Link row always renders when the rate card has an SL
      // price, even if the benchmark data hasn't loaded yet — numbers just
      // fall back to "—".
      const tableRows = [];
      filtered.forEach(p => {
        const agg = aggregated[p.id] || {};
        tableRows.push({ pub: p, product: "Takeover", metrics: agg.takeover, price: p.takeover });
        if (p.sponsoredLink != null) {
          tableRows.push({
            pub: p,
            product: "Sponsored Link",
            metrics: agg.sponsoredLink || null,
            price: p.sponsoredLink
          });
        }
      });

      // Derive CPM so we can sort by it
      tableRows.forEach(r => {
        r.cpm = (r.price != null && r.metrics && r.metrics.impressions) ? (r.price / (r.metrics.impressions / 1000)) : null;
      });

      const sortedRows = useMemo(() => {
        if (!sortKey) return tableRows;
        const dir = sortDir === "asc" ? 1 : -1;
        const getVal = r => {
          switch (sortKey) {
            case "publication": return r.pub.displayName.toLowerCase();
            case "product":     return r.product;
            case "impressions": return r.metrics ? r.metrics.impressions : null;
            case "clicks":      return r.metrics ? r.metrics.clicks      : null;
            case "ctr":         return r.metrics ? r.metrics.ctr         : null;
            case "leads":       return r.metrics ? r.metrics.leads       : null;
            case "price":       return r.price;
            case "cpm":         return r.cpm;
            default: return 0;
          }
        };
        // null/missing values sink to the bottom regardless of direction
        return [...tableRows].sort((a, b) => {
          const va = getVal(a), vb = getVal(b);
          if (va == null && vb == null) return 0;
          if (va == null) return 1;
          if (vb == null) return -1;
          if (typeof va === "string") return va.localeCompare(vb) * dir;
          return (va - vb) * dir;
        });
      }, [tableRows, sortKey, sortDir]);

      const toggleSort = (key) => {
        if (sortKey === key) {
          setSortDir(d => d === "asc" ? "desc" : "asc");
        } else {
          setSortKey(key);
          setSortDir(key === "publication" || key === "product" ? "asc" : "desc");
        }
      };

      const sortArrow = (key) => {
        if (sortKey !== key) return <span className="text-white/40 ml-1">↕</span>;
        return <span className="ml-1">{sortDir === "asc" ? "↑" : "↓"}</span>;
      };

      const Th = ({ k, align = "right", children }) => (
        <th
          onClick={() => toggleSort(k)}
          className={"select-none cursor-pointer hover:bg-white/10 px-4 py-3 font-semibold " + (align === "left" ? "text-left" : "text-right")}
        >
          {children}{sortArrow(k)}
        </th>
      );

      return (
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <div className="flex flex-wrap gap-1.5">
              {["All", ...BENCH_CATEGORIES].map(c => (
                <button
                  key={c}
                  onClick={() => setFilter(c)}
                  className={"px-3 py-1.5 rounded-full text-xs font-medium transition " + (filter === c ? "navy text-white" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200")}
                >
                  {catLabel(c)}
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-2">
              <button
                onClick={() => setShowDebug(s => !s)}
                className={"px-3 py-1.5 rounded-md border text-xs font-medium transition " + (showDebug ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 hover:bg-slate-100 border-slate-200")}
                title="Show raw data returned by Apps Script"
              >
                {showDebug ? "Hide" : "Show"} raw data
              </button>
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search publications…"
                className="px-3 py-1.5 rounded-md border border-slate-200 text-sm w-56 focus:outline-none orange-ring"
              />
            </div>
          </div>

          {showDebug && debug && (
            <div className="bg-slate-900 text-slate-100 rounded-xl p-4 mb-4 text-xs font-mono overflow-x-auto">
              <div className="mb-2"><span className="text-slate-400">rows returned:</span> <span className="text-green-300">{debug.count}</span></div>
              <div className="mb-2"><span className="text-slate-400">distinct publication_type values ({debug.pubTypes.length}):</span> <span className="text-amber-300">{debug.pubTypes.join(" | ") || "(none)"}</span></div>
              <div className="mb-2"><span className="text-slate-400">distinct market values ({debug.markets.length}):</span> <span className="text-amber-300">{debug.markets.join(" | ") || "(none)"}</span></div>
              <div className="mb-2"><span className="text-slate-400">distinct ad_unit slug prefixes ({debug.adUnitPrefixes.length}):</span> <span className="text-amber-300">{debug.adUnitPrefixes.join(" | ") || "(none)"}</span></div>
              <div className="mt-3 text-slate-400">first 3 parsed rows (as the frontend sees them):</div>
              <pre className="text-slate-200 mt-1">{JSON.stringify(debug.sample, null, 2)}</pre>
            </div>
          )}
          {showDebug && !debug && (
            <div className="bg-slate-900 text-slate-100 rounded-xl p-4 mb-4 text-xs">
              Apps Script returned zero rows. Paste the Periscope CSV into cell A1 of the Benchmarks tab and hit Refresh.
            </div>
          )}

          <div className="bg-white rounded-xl table-shadow overflow-hidden">
            <div className="overflow-x-auto scroll-thin">
              <table className="w-full text-sm">
                <thead className="navy text-white">
                  <tr>
                    <Th k="publication" align="left">Publication</Th>
                    <Th k="product"     align="left">Product</Th>
                    <Th k="impressions">Impressions</Th>
                    <Th k="clicks">Clicks</Th>
                    <Th k="ctr">CTR</Th>
                    <Th k="leads">Leads</Th>
                    <Th k="price">Price</Th>
                    <Th k="cpm">CPM</Th>
                  </tr>
                </thead>
                <tbody>
                  {sortedRows.length === 0 && (
                    <tr><td colSpan={8} className="px-4 py-8 text-center text-slate-400">No publications match.</td></tr>
                  )}
                  {sortedRows.map((r, i) => {
                    const m = r.metrics;
                    const noData = !m;
                    return (
                      <tr key={r.pub.id + "-" + r.product} className={"border-t border-slate-100 " + (i % 2 ? "bg-orange-50/20" : "")}>
                        <td className="px-4 py-2.5">
                          <div className="font-medium text-slate-900 flex items-center gap-2">
                            {r.pub.displayName}
                            {r.pub.uncertain && (
                              <span title="Slug mapping is a guess — may need correction" className="text-amber-500 text-xs">⚠</span>
                            )}
                          </div>
                          <div className="text-xs text-slate-400">{catLabel(r.pub.category)}</div>
                        </td>
                        <td className="px-4 py-2.5">
                          <span className={"px-2 py-0.5 rounded text-xs font-medium " + (PRODUCT_BADGE_CLASS[r.product] || "bg-slate-100 text-slate-700")}>
                            {r.product}
                          </span>
                        </td>
                        <td className="px-4 py-2.5 text-right tabular-nums">{noData ? "—" : fmtNum(m.impressions)}</td>
                        <td className="px-4 py-2.5 text-right tabular-nums">{noData ? "—" : fmtNum(m.clicks)}</td>
                        <td className="px-4 py-2.5 text-right tabular-nums">{noData ? "—" : fmtPct(m.ctr)}</td>
                        <td className="px-4 py-2.5 text-right tabular-nums">{noData ? "—" : fmtNum(m.leads)}</td>
                        <td className="px-4 py-2.5 text-right tabular-nums font-medium">
                          {fmtMoney(r.price)}{r.priceSuffix && <span className="text-xs text-slate-400">{r.priceSuffix}</span>}
                        </td>
                        <td className="px-4 py-2.5 text-right tabular-nums text-slate-500">{fmtCpm(r.cpm)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {loadStatus === "ok" && sortedRows.every(r => !r.metrics) && (
            <div className="mt-4 text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
              Sheet loaded but no rows matched any rate card slug. Double-check the <code>ad_unit</code> column in your Sheet — it should look like <code>atlanta_lead</code>, <code>affordable-housing_text-1</code>, etc.
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // CALCULATOR TAB
    // ─────────────────────────────────────────────────────────────
    function CalculatorTab({ rateCard, aggregated, lineItems, setLineItems }) {
      const [picker, setPicker] = useState({ pubId: "", product: "Takeover", qty: 1 });
      const [discountPct, setDiscountPct] = useState(0);

      const validProducts = useMemo(() => {
        const pub = rateCard.find(p => p.id === picker.pubId);
        if (!pub) return ["Takeover"];
        if (pub.isRoS) return ["Run of Site"];
        if (pub.isCustomContent) return ["Custom Content"];
        const opts = ["Takeover"];
        if (pub.sponsoredLink != null) opts.push("Sponsored Link");
        return opts;
      }, [picker.pubId, rateCard]);

      // Auto-correct picker.product when pub changes and current product not valid
      useEffect(() => {
        if (!validProducts.includes(picker.product)) {
          setPicker(p => ({ ...p, product: validProducts[0] }));
        }
      }, [validProducts]);

      const addLine = () => {
        const pub = rateCard.find(p => p.id === picker.pubId);
        if (!pub) return;
        const qty = Math.max(1, parseInt(picker.qty) || 1);
        const agg = aggregated[pub.id] || {};
        let metrics, price;
        if (picker.product === "Takeover") {
          metrics = agg.takeover; price = pub.takeover;
        } else if (picker.product === "Sponsored Link") {
          metrics = agg.sponsoredLink; price = pub.sponsoredLink;
        } else if (picker.product === "Custom Content") {
          // Custom Content has no benchmark data — flat $5,750 per unit.
          metrics = null; price = pub.takeover;
        } else if (picker.product === "Run of Site") {
          metrics = agg.ros; price = pub.cpmPrice;
        }
        setLineItems(prev => [...prev, {
          uid: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
          pubId: pub.id,
          pubName: pub.displayName,
          category: pub.category,
          product: picker.product,
          qty,
          unitPrice: price,
          metrics: metrics || null,
        }]);
        setPicker(p => ({ ...p, qty: 1 }));
      };

      const removeLine = (uid) => setLineItems(prev => prev.filter(l => l.uid !== uid));

      const updateLineQty = (uid, qty) => {
        const q = Math.max(1, parseInt(qty) || 1);
        setLineItems(prev => prev.map(l => l.uid === uid ? { ...l, qty: q } : l));
      };

      const updateLinePrice = (uid, price) => {
        const p = Math.max(0, parseFloat(price) || 0);
        setLineItems(prev => prev.map(l => l.uid === uid ? { ...l, unitPrice: p } : l));
      };

      const totals = useMemo(() => {
        let imp = 0, clk = 0, leads = 0, subtotal = 0;
        let missingMetrics = 0;
        lineItems.forEach(l => {
          if (l.metrics) {
            imp   += (l.metrics.impressions || 0) * l.qty;
            clk   += (l.metrics.clicks || 0)      * l.qty;
            leads += (l.metrics.leads || 0)       * l.qty;
          } else {
            missingMetrics++;
          }
          subtotal += (l.unitPrice || 0) * l.qty;
        });
        const pct = Math.min(100, Math.max(0, Number(discountPct) || 0));
        const discountAmt = subtotal * (pct / 100);
        const price = subtotal - discountAmt;
        return {
          impressions: imp,
          clicks: clk,
          leads: leads,
          ctr: imp ? clk / imp : 0,
          subtotal,
          discountAmt,
          discountPct: pct,
          price,
          cpm: imp ? price / (imp / 1000) : 0,
          missingMetrics
        };
      }, [lineItems, discountPct]);

      const sortedRateCard = useMemo(() =>
        [...rateCard].sort((a, b) => a.displayName.localeCompare(b.displayName)),
        [rateCard]
      );

      const exportProposal = () => {
        const lines = [
          ["Publication", "Product", "Qty", "Unit Price", "Subtotal", "Impressions", "Clicks", "CTR", "Leads"],
          ...lineItems.map(l => {
            const m = l.metrics || {};
            return [
              l.pubName,
              l.product,
              l.qty,
              l.unitPrice,
              l.unitPrice * l.qty,
              (m.impressions || 0) * l.qty,
              (m.clicks || 0) * l.qty,
              m.ctr ? (m.ctr * 100).toFixed(2) + "%" : "",
              (m.leads || 0) * l.qty
            ];
          }),
          [],
          ["SUBTOTAL", "", "", "", totals.subtotal],
          ["DISCOUNT (" + totals.discountPct + "%)", "", "", "", -totals.discountAmt],
          ["TOTAL", "", "", "", totals.price, totals.impressions, totals.clicks, (totals.ctr * 100).toFixed(2) + "%", totals.leads],
          ["BLENDED CPM", "", "", "", "$" + totals.cpm.toFixed(2)]
        ];
        const csv = lines.map(r => r.map(c => {
          const s = String(c == null ? "" : c);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "proposal-" + new Date().toISOString().slice(0,10) + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-2 space-y-6">
            {/* Add Product card */}
            <div className="bg-white rounded-xl table-shadow p-5">
              <div className="text-sm font-semibold navy-text mb-3">Add a product</div>
              <div className="grid grid-cols-1 md:grid-cols-12 gap-2">
                <select
                  value={picker.pubId}
                  onChange={e => setPicker(p => ({ ...p, pubId: e.target.value }))}
                  className="md:col-span-6 px-3 py-2 border border-slate-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
                >
                  <option value="">Select publication…</option>
                  {CATEGORIES.map(cat => (
                    <optgroup key={cat} label={cat}>
                      {sortedRateCard.filter(p => p.category === cat).map(p => (
                        <option key={p.id} value={p.id}>{p.displayName}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
                <select
                  value={picker.product}
                  onChange={e => setPicker(p => ({ ...p, product: e.target.value }))}
                  disabled={!picker.pubId}
                  className="md:col-span-3 px-3 py-2 border border-slate-200 rounded-md text-sm disabled:bg-slate-50 disabled:text-slate-400"
                >
                  {validProducts.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
                <input
                  type="number"
                  min="1"
                  value={picker.qty}
                  onChange={e => setPicker(p => ({ ...p, qty: e.target.value }))}
                  className="md:col-span-1 px-3 py-2 border border-slate-200 rounded-md text-sm price-input"
                  placeholder="Qty"
                />
                <button
                  onClick={addLine}
                  disabled={!picker.pubId}
                  className="md:col-span-2 px-3 py-2 navy text-white rounded-md text-sm font-medium disabled:opacity-40 hover:opacity-90"
                >
                  + Add
                </button>
              </div>
            </div>

            {/* Line items */}
            <div className="bg-white rounded-xl table-shadow overflow-hidden">
              <div className="overflow-x-auto scroll-thin">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="text-left px-4 py-3 font-semibold text-slate-600">Product</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-20">Qty</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-32">Unit Price</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-28">Subtotal</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-24">Impr.</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-20">Clicks</th>
                      <th className="text-right px-4 py-3 font-semibold text-slate-600 w-20">Leads</th>
                      <th className="w-10"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {lineItems.length === 0 && (
                      <tr><td colSpan={8} className="px-4 py-8 text-center text-slate-400">No products added yet. Pick a publication above to get started.</td></tr>
                    )}
                    {lineItems.map(l => {
                      const m = l.metrics;
                      return (
                        <tr key={l.uid} className="border-t border-slate-100">
                          <td className="px-4 py-2.5">
                            <div className="font-medium text-slate-900">{l.pubName}</div>
                            <div className="text-xs text-slate-400">{l.product}{!m && " · ⚠ no benchmark match"}</div>
                          </td>
                          <td className="px-4 py-2.5 text-right">
                            <input
                              type="number"
                              min="1"
                              value={l.qty}
                              onChange={e => updateLineQty(l.uid, e.target.value)}
                              className="w-16 px-2 py-1 border border-slate-200 rounded text-right text-sm price-input"
                            />
                          </td>
                          <td className="px-4 py-2.5 text-right">
                            <div className="flex items-center justify-end gap-1">
                              <span className="text-slate-400">$</span>
                              <input
                                type="number"
                                min="0"
                                value={l.unitPrice ?? ""}
                                onChange={e => updateLinePrice(l.uid, e.target.value)}
                                className="w-24 px-2 py-1 border border-slate-200 rounded text-right text-sm price-input"
                              />
                            </div>
                          </td>
                          <td className="px-4 py-2.5 text-right tabular-nums font-medium">{fmtMoney(l.unitPrice * l.qty)}</td>
                          <td className="px-4 py-2.5 text-right tabular-nums text-slate-600">{m ? fmtNum(m.impressions * l.qty) : "—"}</td>
                          <td className="px-4 py-2.5 text-right tabular-nums text-slate-600">{m ? fmtNum(m.clicks * l.qty) : "—"}</td>
                          <td className="px-4 py-2.5 text-right tabular-nums text-slate-600">{m ? fmtNum(m.leads * l.qty) : "—"}</td>
                          <td className="px-4 py-2.5 text-right">
                            <button onClick={() => removeLine(l.uid)} className="text-slate-300 hover:text-red-500 text-lg leading-none">×</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {lineItems.length > 0 && (
              <div className="flex justify-end">
                <button onClick={exportProposal} className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 rounded-md text-sm font-medium text-slate-700">
                  ↓ Export proposal as CSV
                </button>
              </div>
            )}
          </div>

          {/* Totals card */}
          <div className="lg:col-span-1">
            <div className="bg-white rounded-xl table-shadow sticky top-4">
              <div className="navy text-white px-5 py-4 rounded-t-xl">
                <div className="text-xs uppercase tracking-widest text-white/80">Campaign Totals</div>
                <div className="text-3xl font-bold tabular-nums mt-1">{fmtMoney(totals.price)}</div>
                <div className="text-xs text-white/80 mt-1">{lineItems.length} {lineItems.length === 1 ? "line" : "lines"}</div>
              </div>
              <div className="p-5 space-y-3 text-sm">
                <TotalRow label="Impressions" value={fmtNum(totals.impressions)} />
                <TotalRow label="Clicks"      value={fmtNum(totals.clicks)} />
                <TotalRow label="Blended CTR" value={fmtPct(totals.ctr)} />
                <TotalRow label="Leads"       value={fmtNum(totals.leads)} />
                <div className="border-t border-slate-100 pt-3" />
                <TotalRow label="Subtotal"    value={fmtMoney(totals.subtotal)} />
                <div className="flex justify-between items-center">
                  <div className="text-slate-500">Campaign Discount</div>
                  <div className="flex items-center gap-1">
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="0.5"
                      value={discountPct}
                      onChange={e => setDiscountPct(e.target.value)}
                      className="w-16 px-2 py-1 border border-slate-200 rounded text-right text-sm price-input orange-ring"
                    />
                    <span className="text-slate-400">%</span>
                  </div>
                </div>
                {totals.discountAmt > 0 && (
                  <div className="flex justify-between items-baseline text-xs">
                    <div className="text-slate-400">Discount amount</div>
                    <div className="tabular-nums text-red-500">−{fmtMoney(totals.discountAmt)}</div>
                  </div>
                )}
                <div className="border-t border-slate-100 pt-3" />
                <TotalRow label="Total Price" value={fmtMoney(totals.price)} bold />
                <TotalRow label="Blended CPM" value={fmtCpm(totals.cpm)} bold />
              </div>
              {totals.missingMetrics > 0 && (
                <div className="px-5 pb-4 text-xs text-amber-700 bg-amber-50 mx-5 mb-4 rounded p-2">
                  ⚠ {totals.missingMetrics} {totals.missingMetrics === 1 ? "line has" : "lines have"} no benchmark data — clicks/impressions/leads not included in totals.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function TotalRow({ label, value, bold }) {
      return (
        <div className="flex justify-between items-baseline">
          <div className="text-slate-500">{label}</div>
          <div className={"tabular-nums " + (bold ? "font-bold text-lg navy-text" : "text-slate-900")}>{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // RATE CARD TAB — read-only reference view. Per-line price tweaks
    // happen inside the Proposal Calculator, not here.
    // ─────────────────────────────────────────────────────────────
    function RateCardTab({ rateCard }) {
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("All");

      const filtered = useMemo(() =>
        rateCard.filter(p =>
          (filter === "All" || p.category === filter) &&
          (!search || p.displayName.toLowerCase().includes(search.toLowerCase()))
        ),
        [rateCard, filter, search]
      );

      return (
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-4">
            <div className="flex flex-wrap gap-1.5">
              {["All", ...CATEGORIES].map(c => (
                <button
                  key={c}
                  onClick={() => setFilter(c)}
                  className={"px-3 py-1.5 rounded-full text-xs font-medium transition " + (filter === c ? "navy text-white" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200")}
                >
                  {c}
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-3">
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search publications…"
                className="px-3 py-1.5 rounded-md border border-slate-200 text-sm w-56 focus:outline-none orange-ring"
              />
            </div>
          </div>

          <div className="bg-white rounded-xl table-shadow overflow-hidden">
            <div className="overflow-x-auto scroll-thin">
              <table className="w-full text-sm">
                <thead className="navy text-white">
                  <tr>
                    <th className="text-left px-4 py-3 font-semibold">Publication</th>
                    <th className="text-left px-4 py-3 font-semibold">Category</th>
                    <th className="text-right px-4 py-3 font-semibold">Takeover</th>
                    <th className="text-right px-4 py-3 font-semibold">Sponsored Link</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((p, i) => {
                    const isRoSRow = !!p.isRoS;
                    return (
                      <tr key={p.id} className={"border-t border-slate-100 " + (i % 2 ? "bg-orange-50/20" : "")}>
                        <td className="px-4 py-2.5">
                          <div className="font-medium text-slate-900 flex items-center gap-2">
                            {p.displayName}
                            {p.uncertain && <span title="Slug mapping is a guess" className="text-amber-500 text-xs">⚠</span>}
                            {p.note && <span className="text-xs text-slate-400">({p.note})</span>}
                          </div>
                        </td>
                        <td className="px-4 py-2.5 text-slate-500">{p.category}</td>
                        <td className="px-4 py-2.5 text-right tabular-nums">
                          {isRoSRow ? (
                            <span className="font-medium text-slate-900">{fmtMoney(p.cpmPrice)}<span className="text-xs text-slate-400"> CPM</span></span>
                          ) : (
                            <span className="font-medium text-slate-900">{fmtMoney(p.takeover)}</span>
                          )}
                        </td>
                        <td className="px-4 py-2.5 text-right tabular-nums">
                          {p.sponsoredLink == null ? (
                            <span className="text-slate-300">—</span>
                          ) : (
                            <span className="font-medium text-slate-900">{fmtMoney(p.sponsoredLink)}</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="text-xs text-slate-500 mt-3">
            Rate card is the baseline reference. For per-line price adjustments on a specific proposal, use the Proposal Calculator.
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
